# checkout: what team-checkout runs. Owned by team-checkout.
# podinfo stands in for the real checkout image.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkout
  namespace: checkout-dev
  labels:
    app.kubernetes.io/name: checkout
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: checkout
  template:
    metadata:
      labels:
        app.kubernetes.io/name: checkout
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: checkout
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: checkout
      containers:
        - name: checkout
          image: ghcr.io/stefanprodan/podinfo:6.17.0
          ports:
            - name: http
              containerPort: 9898
          env:
            - name: DB_PASSWORD         # a reference to a Secret by name; the value is not here
              valueFrom:
                secretKeyRef:
                  name: checkout-db
                  key: password
          envFrom:
            - configMapRef:
                name: checkout-settings-v2
          volumeMounts:
            - name: settings
              mountPath: /etc/checkout
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              memory: 192Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 2
            failureThreshold: 30
      volumes:
        - name: settings
          configMap:
            name: checkout-settings-v2
